[package]
name = "chopper-zip"
version = "2.4.2"
edition = "2021"
authors = [
    "Mathijs van de Nes <git@mathijs.vd-nes.nl>",
    "Marli Frost <marli@frost.red>",
    "Ryan Levick <ryan.levick@gmail.com>",
    "Chris Hennick <hennickc@amazon.com>",
]
description = "Chopper's ZIP reader with audited metadata and member admission"
license = "MIT"
repository = "https://github.com/jsmatfess/chopper"
readme = "CHOPPER.md"
include = ["src/**", "CHOPPER.md", "README.md", "LICENSE"]

[lib]
name = "zip"

[features]
default = ["deflate"]
deflate = ["deflate-flate2", "deflate-zopfli"]
deflate-flate2 = ["dep:flate2", "_deflate-any"]
deflate-zopfli = ["dep:zopfli", "_deflate-any"]
_deflate-any = []

[dependencies]
crc32fast = "1.4"
displaydoc = { version = "0.2", default-features = false }
flate2 = { package = "chopper-flate2", path = "../flate2-1.1.10", version = "=1.1.10", optional = true }
# Preserve the audited map and table allocation behavior in consumer lockfiles.
indexmap = "=2.14.2"
hashbrown = { version = "=0.17.1", default-features = false }
memchr = "2.7"
thiserror = "2"
zopfli = { version = "0.8", optional = true }

[target.'cfg(any(all(target_arch = "arm", target_pointer_width = "32"), target_arch = "mips", target_arch = "powerpc"))'.dependencies]
crossbeam-utils = "0.8.21"

[target.'cfg(fuzzing)'.dependencies]
arbitrary = { version = "1.4.1", features = ["derive"] }

[lints.rust.unexpected_cfgs]
level = "warn"
# Recognize upstream cfg names without exposing their unaudited dependencies.
check-cfg = [
    'cfg(fuzzing)',
    'cfg(feature, values("aes-crypto", "bzip2", "chrono", "deflate64", "lzma", "nt-time", "time", "unreserved", "xz", "zstd"))',
]
