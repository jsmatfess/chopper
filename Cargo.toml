[workspace]
members = ["crates/chopper-core", "crates/chopper", "crates/chopper-browser"]
exclude = ["vendor/zip-2.4.2", "vendor/zstd-sys-2.1.1"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
zip = { path = "vendor/zip-2.4.2" }
zstd-sys = { path = "vendor/zstd-sys-2.1.1" }
