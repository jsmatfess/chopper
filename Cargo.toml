[workspace]
members = ["crates/chopper-core", "crates/chopper", "crates/chopper-browser"]
exclude = [
    "crates/chopper-python",
    "vendor/flate2-1.1.10",
    "vendor/serde_json-1.0.151",
    "vendor/zip-2.4.2",
]
resolver = "2"

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/jsmatfess/chopper"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { package = "chopper-serde-json", path = "vendor/serde_json-1.0.151", version = "=1.0.151" }

[profile.release]
lto = "thin"
codegen-units = 1
