[package]
name = "chopper-python"
version = "0.7.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
chopper = { package = "chopper-csv", path = "../chopper" }
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }
serde = "=1.0.229"
serde_json = { package = "chopper-serde-json", path = "../../vendor/serde_json-1.0.151", version = "=1.0.151" }

[profile.release]
lto = "thin"
codegen-units = 1
