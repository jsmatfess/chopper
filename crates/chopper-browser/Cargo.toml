[package]
name = "chopper-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Explicit test reactor; excluded from the production hosted artifact.
resource-contract-tests = ["chopper/resource-contract-tests"]
experimental-spill-blocks = ["chopper/experimental-spill-blocks"]
experimental-parallel-profile = ["chopper/experimental-parallel-profile"]
experimental-shuffle-partition = ["chopper/experimental-shuffle-partition"]
experimental-nested-balanced = ["chopper/experimental-nested-balanced"]
experimental-constant-partition = ["chopper/experimental-constant-partition"]
experimental-consecutive-partitions = ["chopper/experimental-consecutive-partitions"]

experimental-partition-balanced = ["chopper/experimental-partition-balanced"]

experimental-streaming-chain = ["chopper/experimental-streaming-chain"]







[dependencies]
chopper = { package = "chopper-csv", path = "../chopper" }
serde_json.workspace = true
serde.workspace = true
anyhow = "1"
