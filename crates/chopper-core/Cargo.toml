[package]
name = "chopper-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Opt-in decoder output directly into large caller buffers; small reads unchanged.
experimental-direct-decode = []

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = { version = "1", default-features = false, features = ["pure"] }
encoding_rs = "0.8"
memchr = "2"

