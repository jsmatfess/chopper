[package]
name = "chopper-csv"
version.workspace = true
edition.workspace = true
license-file = "../../LICENSE"
repository.workspace = true
description = "Run composable, bounded-memory CSV Jobs"
readme = "../../docs/user/libraries.md"
default-run = "chopper"

[lib]
name = "chopper"

[[bin]]
name = "chopper"
path = "src/main.rs"

[features]
# A guaranteed one-chunk group needs one typed record, not a temporary catalog.
experimental-single-final-catalog = ["experimental-memory-final-writers"]
# Linux one-chunk final writers flush all buffers before syncing original handles.
experimental-batched-final-sync = ["experimental-single-final-catalog"]
# One descriptor per uncapped writer; bounded memory-proportional selector.
experimental-single-catalog-capacity = ["experimental-single-final-catalog", "experimental-small-final-buffers"]
# Count retained strata before exact quota streams feed bounded final writers.
experimental-retained-exact-writers = ["experimental-bounded-final-partition", "experimental-terminal-routing"]
# Only bounded fanout catalogs use smaller metadata buffers; no selector change.
experimental-small-final-catalogs = ["experimental-memory-final-writers"]
# A declared output-file ceiling can bound one-pass private Partition writers.
experimental-bounded-final-partition = ["experimental-memory-final-writers"]
# Smaller per-file fanout buffers permit a higher memory-proportional ceiling.
experimental-small-final-buffers = ["experimental-memory-final-writers"]
# Extend the strict count/digest Balanced pass to existing output codecs.
experimental-counted-codec-balanced = ["experimental-counted-balanced"]
# Shared fanout never reuses each writer's retained header encoder buffers.
experimental-release-final-header-scratch = ["experimental-shared-final-serializer"]
# Opt-in memory-proportional configured writer fanout, guarded by native handles.
experimental-memory-final-writers = ["experimental-shared-final-serializer"]
# Opt-in bounded composed count-independent memberships into final writers.
experimental-final-writer-chains = ["experimental-shared-final-serializer"]
# Experiment control for sharing encoded row scratch across bounded final writers.
experimental-shared-final-serializer = ["experimental-final-writers"]
# Opt-in native bounded final writers for singleton count-independent grouping.
experimental-final-writers = []
# Opt-in native Partition/Interleaved, stratified exact and probabilistic direct publication.
experimental-terminal-routing = []
# Opt-in Linux clean inactive-file estimate; retained allocations remain charged.
experimental-cgroup-cache-headroom = []
experimental-direct-decode = ["chopper-core/experimental-direct-decode"]
# Opt-in native count/validate pass followed by exact Balanced streaming.
experimental-counted-balanced = []
# Opt-in bounded native count and emit passes for Partition followed by Balanced.
experimental-counted-partition-balanced = ["experimental-counted-balanced", "experimental-bounded-final-partition"]
# Opt-in root external shuffle/balanced serialization into private publication.
experimental-terminal-shuffle = []
# Test-only deterministic resource contracts; never enabled by production builds.
resource-contract-tests = []
# Opt-in external spill block/framing experiment; v1 rows remain the default.
experimental-spill-blocks = []
# Opt-in larger merge fan-in for terminal native Linux Uniform shuffle.
experimental-wide-uniform-merge = ["experimental-terminal-shuffle"]
experimental-short-terminal-uniform-merge = ["experimental-wide-uniform-merge"]
# Opt-in native profiling hash batches; serial profiling remains the default.
experimental-parallel-profile = []
# Opt-in native overlap of plain prepared-output files using requested workers.
experimental-plain-publication = []
# Opt-in exact-v1 uniform shuffle followed by value partition fusion.
experimental-shuffle-partition = []
# Opt-in Linux fusion of retained plain probabilistic assignment and Uniform.
experimental-probabilistic-shuffle-fusion = []
# Opt-in Linux in-place quota index for high-fanout exact assignment.
experimental-exact-quota-index = []
# Opt-in single traversal of nested balanced ranges.
experimental-nested-balanced = []
# Opt-in elimination of partition keys proven constant by previous partitions.
experimental-constant-partition = []
# Opt-in single grouping traversal for adjacent value partitions.
experimental-consecutive-partitions = []

# Opt-in exact partition/uniform/balanced traversal with bounded tuple counts.
experimental-partition-balanced = []

# Opt-in exact count-independent membership/partition/membership routing.
experimental-streaming-chain = []







[dependencies]
chopper-core = { path = "../chopper-core", version = "=0.7.0" }
anyhow = "1"
# The admitted Job decoder uses the pinned serde Content and JSON scratch layouts.
serde.workspace = true
serde_json.workspace = true
blake3 = "1"
tempfile = "3"
# Codec admission is audited against these implementations; re-audit on update.
flate2 = { package = "chopper-flate2", path = "../../vendor/flate2-1.1.10", version = "=1.1.10" }
miniz_oxide = "=0.9.1"
zip = { package = "chopper-zip", path = "../../vendor/zip-2.4.2", version = "=2.4.2", default-features = false, features = ["deflate"] }
crc32fast = "1"
getrandom = "0.2"

[target.'cfg(not(target_os = "wasi"))'.dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
fs2 = "0.4"
rayon = "1"
# Path captures are covered by the scripted Job decoder's admission audit.
serde_path_to_error = "=0.1.20"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(unix, target_os = "wasi"))'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]


