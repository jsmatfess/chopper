name: Bug report
description: Report something that is not working as expected.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Chopper. Use synthetic data for reproductions.
        Do not include confidential CSVs, credentials, private paths or unredacted logs.
        Report security vulnerabilities privately through the link in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: CLI version from chopper --version, or the hosted app URL and date tested.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system; for the hosted app, include browser name and version.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest synthetic CSV and configuration or command that demonstrates the problem. Replace private paths with placeholders.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: What did you expect, and what happened instead? Include a sanitized error message if available.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I have removed confidential data, credentials, private paths and sensitive information from attachments and logs.
          required: true
